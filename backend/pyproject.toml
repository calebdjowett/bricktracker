[project]
name = "bricktracker-api"
version = "0.1.0"
description = "BrickTracker FastAPI backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.5,<3.0", "requests-oauthlib>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<1.0"]
